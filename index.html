<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beenrated</title>
<meta name="description" content="Duke students rate classes on difficulty, workload, exams, attendance and whether they'd take them again.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one reading column; classes scanned like a registrar listing, each with a stamped "would take again" score and star rows. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#141A2E; --muted:#5A6378; --line:#DCE1EC; --chip:#E7EBF6;
  --accent:#2B44E0; --accent-ink:#FFFFFF; --star:#E09A12; --star-off:#D3D9E6;
  --good:#1D8657; --mid:#B97E0E; --bad:#C23F2C;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#151A2C; --ink:#E8EBF5; --muted:#99A2BA; --line:#283050; --chip:#1D2440;
  --accent:#8193FF; --accent-ink:#0D1120; --star:#F2BE4A; --star-off:#2F3757;
  --good:#4CC48B; --mid:#E5B14A; --bad:#F0745F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#151A2C; --ink:#E8EBF5; --muted:#99A2BA; --line:#283050; --chip:#1D2440;
  --accent:#8193FF; --accent-ink:#0D1120; --star:#F2BE4A; --star-off:#2F3757;
  --good:#4CC48B; --mid:#E5B14A; --bad:#F0745F; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:24px}
main{display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--accent);font-family:var(--display);font-weight:800;font-size:30px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.intro h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.025em}
.intro p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.notice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px;margin:0}

.controls{display:flex;flex-direction:column;gap:12px}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .mono{font-weight:600}
.sort{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sort select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}

.attr{font-family:var(--mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.attrs{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:hover{background:var(--surface)}
.item .code{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .title{font-weight:600;font-size:16px}
.item .meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.item .meta b{color:var(--ink)}
.item .count{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}

.stamp{--c:var(--muted);width:54px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--mono);font-weight:600;font-size:19px;line-height:1;color:var(--c);
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.stamp small{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body);font-weight:600}
.stamp.big{width:92px;height:92px;font-size:32px;border-radius:16px}
.stamp.big small{font-size:10px;margin-top:3px}

.stars{position:relative;display:inline-block;color:var(--star-off);letter-spacing:1px;line-height:1;white-space:nowrap}
.stars::before{content:"★★★★★";position:absolute;left:0;top:0;width:var(--p);overflow:hidden;color:var(--star)}

.empty{padding:32px 4px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

.back{font-size:14px;text-decoration:none}
.course-head{display:flex;gap:18px;align-items:flex-start}
.course-head .code{font-family:var(--mono);color:var(--muted);font-weight:600}
.course-head h2{font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.02em;margin-top:4px}

.measures{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.measure{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.measure:last-child{border-bottom:0}
.measure .name{font-weight:500}
.measure .name small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.measure .stars{font-size:20px}
.measure .v{font-family:var(--mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.useful{display:flex;flex-wrap:wrap;gap:6px}
.useful span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px}

.reviews{display:flex;flex-direction:column;gap:12px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.review.mine{border-color:var(--accent)}
.review .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.review .who b{font-weight:600}
.review .who span{font-size:12.5px;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 16px}
.mini{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.mini .stars{font-size:14px}
.review p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.review .uf{font-size:13.5px}
.review .uf b{font-weight:600}
.review .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

form,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px}
form h3{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input[type=text],.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box}
.field textarea{min-height:100px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.hint{font-size:12.5px;color:var(--muted)}

.pickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:0}
.pickrow .name{font-weight:500}
.pickrow .name small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.starpick{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end}
.starpick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.starpick label{font-size:28px;line-height:1;padding:0 2px;color:var(--star-off);cursor:pointer}
.starpick input:checked~label,.starpick label:hover,.starpick label:hover~label{color:var(--star)}
.starpick input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
@media (max-width:480px){.pickrow{grid-template-columns:minmax(0,1fr)}}

.err{color:var(--bad);font-size:14px;margin:0}
.ok{color:var(--good);font-size:14px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.item,.btn{transition:background .15s,border-color .15s}}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who-am-i{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#" aria-label="beenrated home"><b>beenrated</b><i>.</i></a>
    <div class="auth" id="auth"></div>
  </header>
  <main id="app"></main>
  <footer>Reviews are anonymous: only the reviewer's year is shown, never their name or email. Posting needs a duke.edu email so every review comes from a Duke student. Ratings are students' opinions, not official course evaluations.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const MEASURES=[
  {k:"difficulty",label:"General difficulty",lo:"1 = easy",hi:"5 = very hard"},
  {k:"work",label:"Work heavy",lo:"1 = light",hi:"5 = heavy workload"},
  {k:"exams",label:"Exam heavy",lo:"1 = few or no exams",hi:"5 = mostly exams"},
  {k:"attendance",label:"Attendance required",lo:"1 = optional",hi:"5 = mandatory"},
  {k:"again",label:"Would take again",lo:"1 = no way",hi:"5 = definitely"}];
const ATTRS=[["CE","Creating and Engaging with Art","Art"],["HI","Humanistic Inquiry","Humanities"],["IJ","Interpreting Institutions, Justice and Power","Institutions & power"],
  ["NW","Investigating the Natural World","Natural world"],["QC","Quantitative and Computational Reasoning","Quantitative"],["SB","Social and Behavioral Analysis","Social & behavioral"],
  ["WR","Writing","Writing"],["LANG","Counts toward a language pathway","Language"],["CENTURY","Two Century course","Century"]];
const attrName=a=>{const x=ATTRS.find(y=>y[0]===a);return x?x[1]:a};
const attrBadge=a=>a==="LANG"?"Language":a==="CENTURY"?"Century":a;
const YEARS=["1st year","2nd year","3rd year","4th year","Grad student"];

const cfg=window.BEENRATED_CONFIG||{};
const configured=cfg.url&&!/PASTE/.test(cfg.url)&&cfg.anonKey&&!/PASTE/.test(cfg.anonKey);
const sb=configured&&window.supabase?window.supabase.createClient(cfg.url,cfg.anonKey):null;

const S={session:null,loaded:false,loadError:"",courses:new Map(),reviews:new Map(),q:"",attr:"All",sort:"count",editing:false,flash:""};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?"–":v.toFixed(1);
const stars=v=>`<span class="stars" style="--p:${v==null?0:v/5*100}%" aria-label="${f1(v)} out of 5">★★★★★</span>`;
const againColor=v=>v==null?"var(--muted)":v>=4?"var(--good)":v>=3?"var(--mid)":"var(--bad)";
const email=()=>S.session?.user?.email||"";
const isDuke=()=>/@duke\.edu$/i.test(email());
const canWrite=()=>!!(sb&&S.session&&isDuke());
function lastYear(){try{return localStorage.getItem("br-year")||""}catch(e){return""}}
function saveYear(y){try{localStorage.setItem("br-year",y)}catch(e){}}

/* ---------- data ---------- */
async function loadAll(){
  if(!sb)return;
  const [c,r]=await Promise.all([
    sb.from("courses").select("id,dept,num,title,attrs").range(0,4999),
    sb.from("public_reviews").select("*").order("updated_at",{ascending:false}).range(0,19999)]);
  if(c.error||r.error){S.loadError="Couldn't load classes. Refresh the page to try again.";S.loaded=true;return route()}
  S.loadError="";
  S.courses=new Map(c.data.map(x=>[x.id,x]));
  const m=new Map();r.data.forEach(x=>{if(!m.has(x.course_id))m.set(x.course_id,[]);m.get(x.course_id).push(x)});
  S.reviews=m;S.loaded=true;route();
}
const reviewsFor=cid=>S.reviews.get(cid)||[];
function summary(cid){
  const rs=reviewsFor(cid),m={};
  MEASURES.forEach(x=>m[x.k]=avg(rs.map(r=>Number(r[x.k])).filter(n=>n>=1&&n<=5)));
  return {n:rs.length,m,rs};
}

/* ---------- header ---------- */
function renderAuth(){
  const el=document.getElementById("auth");
  if(!sb){el.innerHTML="";return}
  el.innerHTML=S.session
    ?`<span class="who-am-i">${isDuke()?"Signed in":"Signed in (not a Duke email)"}</span><button class="btn small" id="signOut" type="button">Sign out</button><button class="btn primary" id="addBtn" type="button">Add a class</button>`
    :`<button class="btn" id="signInBtn" type="button">Sign in</button><button class="btn primary" id="addBtn" type="button">Add a class</button>`;
  const so=document.getElementById("signOut");if(so)so.onclick=async()=>{await sb.auth.signOut()};
  const si=document.getElementById("signInBtn");if(si)si.onclick=()=>{location.hash="signin"};
  document.getElementById("addBtn").onclick=()=>{location.hash=canWrite()?"add":"signin"};
}

/* ---------- routing ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));
  renderAuth();
  if(h==="signin")return renderSignIn();
  if(h==="add")return renderAdd();
  if(h.startsWith("c-"))return renderCourse(h.slice(2));
  renderList();}
window.addEventListener("hashchange",()=>{S.editing=false;route();window.scrollTo(0,0)});

function statusNotice(){
  if(!sb)return `<p class="notice">This copy of beenrated isn't connected to a database yet. Add your Supabase project address and key to config.js.</p>`;
  if(S.loadError)return `<p class="notice">${esc(S.loadError)}</p>`;
  if(!S.loaded)return `<p class="notice">Loading classes…</p>`;
  if(S.session&&!isDuke())return `<p class="notice">You're signed in as ${esc(email())}. Only duke.edu emails can post. Sign out and sign in with your Duke email to rate classes.</p>`;
  return "";
}
function signInPrompt(what){return `<div class="panel"><p style="margin:0">Sign in with your Duke email to ${what}. Your email is never shown on the site.</p><div><a class="btn primary" href="#signin" style="text-decoration:none;display:inline-block">Sign in</a></div></div>`}

/* ---------- sign in ---------- */
function renderSignIn(){
  if(S.session&&isDuke()){location.hash="";return}
  app.innerHTML=`<a class="back" href="#">← All classes</a>
  <form id="signForm" novalidate>
    <h3>Sign in to rate classes</h3>
    <p class="muted" style="margin:-8px 0 0">We'll email you a sign-in link. No password needed. Reviews only ever show your year.</p>
    <div class="field" style="max-width:360px"><label class="label" for="email">Duke email</label>
      <input type="text" id="email" inputmode="email" autocomplete="email" placeholder="netid@duke.edu"></div>
    <p class="err" id="signErr" hidden></p><p class="ok" id="signOk" hidden></p>
    <div class="actions"><button class="btn primary" type="submit" id="signSubmit">Email me a sign-in link</button></div>
  </form>`;
  document.getElementById("signForm").onsubmit=async e=>{
    e.preventDefault();
    const err=document.getElementById("signErr"),ok=document.getElementById("signOk"),b=document.getElementById("signSubmit");
    const em=document.getElementById("email").value.trim().toLowerCase();
    err.hidden=ok.hidden=true;
    if(!/^[^@\s]+@duke\.edu$/.test(em)){err.textContent="Use your duke.edu email address, like netid@duke.edu.";err.hidden=false;return}
    b.disabled=true;b.textContent="Sending…";
    const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
    b.disabled=false;b.textContent="Email me a sign-in link";
    if(error){err.textContent=/rate/i.test(error.message)?"Too many sign-in emails were sent just now. Wait a few minutes and try again.":"Couldn't send the email: "+error.message;err.hidden=false;return}
    ok.textContent=`Check ${em} for a link from beenrated. Open it on this device to finish signing in.`;ok.hidden=false;
  };
}

/* ---------- list ---------- */
function renderList(){
  const courses=[...S.courses.values()].map(c=>({...c,attrs:c.attrs||[],s:summary(c.id)}));
  const q=S.q.trim().toLowerCase().replace(/\s+/g," ");
  const list=courses.filter(c=>(S.attr==="All"||c.attrs.includes(S.attr))&&(!q||`${c.dept} ${c.num} ${c.dept}${c.num} ${c.title}`.toLowerCase().includes(q)));
  const nz=(v,d)=>v==null?d:v;
  const by={count:(a,b)=>b.s.n-a.s.n,again:(a,b)=>nz(b.s.m.again,-1)-nz(a.s.m.again,-1),easy:(a,b)=>nz(a.s.m.difficulty,9)-nz(b.s.m.difficulty,9),
    light:(a,b)=>nz(a.s.m.work,9)-nz(b.s.m.work,9),exams:(a,b)=>nz(a.s.m.exams,9)-nz(b.s.m.exams,9),attend:(a,b)=>nz(a.s.m.attendance,9)-nz(b.s.m.attendance,9),code:()=>0};
  list.sort((a,b)=>by[S.sort](a,b)||(a.dept+a.num).localeCompare(b.dept+b.num));
  const total=courses.reduce((t,c)=>t+c.s.n,0);
  app.innerHTML=`
  <section class="intro"><h1>Know the class before you take it.</h1>
    <p>Duke students rate classes on difficulty, workload, exams, attendance and whether they'd take them again. <span class="mono">${courses.length}</span> ${courses.length===1?"class":"classes"} · <span class="mono">${total}</span> ${total===1?"rating":"ratings"}.</p></section>
  ${statusNotice()}
  <section class="controls">
    <input class="search" id="q" type="search" placeholder="Search by code or title, e.g. ECON 201 or linear algebra" value="${esc(S.q)}" aria-label="Search classes">
    <span class="label">Filter by Arts &amp; Sciences code</span>
    <div class="row">
      ${["All",...ATTRS.map(x=>x[0])].map(a=>{const x=ATTRS.find(y=>y[0]===a);return `<button class="chip" type="button" data-attr="${esc(a)}" title="${esc(x?x[1]:"All classes")}" aria-pressed="${a===S.attr}">${a==="All"?"All":(a.length<=2?`<span class="mono">${a}</span> ${x[2]}`:x[2])}</button>`}).join("")}
      <label class="sort">Sort
        <select id="sort">
          <option value="count">Most rated</option><option value="again">Most would take again</option><option value="easy">Easiest</option>
          <option value="light">Lightest workload</option><option value="exams">Fewest exams</option><option value="attend">Attendance least required</option><option value="code">Course code</option>
        </select></label>
    </div>
  </section>
  <section class="list" aria-label="Classes">
    ${list.length?list.map(c=>`
      <a class="item" href="#c-${encodeURIComponent(c.id)}">
        <div class="stamp" style="--c:${againColor(c.s.m.again)}" title="Would take again, out of 5">${c.s.n?f1(c.s.m.again):"–"}<small>retake</small></div>
        <div style="min-width:0">
          <div class="code"><span>${esc(c.dept)} ${esc(c.num)}</span>${c.attrs.length?`<span class="attrs">${c.attrs.map(a=>`<span class="attr" title="${esc(attrName(a))}">${esc(attrBadge(a))}</span>`).join("")}</span>`:""}</div>
          <div class="title">${esc(c.title)}</div>
          ${c.s.n?`<div class="meta"><span>Difficulty <b class="mono">${f1(c.s.m.difficulty)}</b></span><span>Work <b class="mono">${f1(c.s.m.work)}</b></span><span>Exams <b class="mono">${f1(c.s.m.exams)}</b></span><span>Attendance <b class="mono">${f1(c.s.m.attendance)}</b></span></div>`:`<div class="meta"><span>No ratings yet. Be the first.</span></div>`}
        </div>
        <div class="count"><span class="mono">${c.s.n}</span> ${c.s.n===1?"rating":"ratings"}</div>
      </a>`).join(""):emptyList(courses.length)}
  </section>`;
  document.getElementById("q").oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;renderList();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
  const so=document.getElementById("sort");so.value=S.sort;so.onchange=e=>{S.sort=e.target.value;renderList()};
  app.querySelectorAll("[data-attr]").forEach(b=>b.onclick=()=>{S.attr=b.dataset.attr;renderList()});
  app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{location.hash=canWrite()?"add":"signin"});
}
function emptyList(n){
  if(!S.loaded||!sb)return "";
  if(n)return `<div class="empty"><h3>No classes match</h3><p>Check the code or filter, or add the class so people can rate it.</p><button class="btn" data-add type="button">Add a class</button></div>`;
  return `<div class="empty"><h3>No classes yet</h3><p>Add a class you've taken, then leave the first rating.</p><button class="btn primary" data-add type="button">Add the first class</button></div>`;
}

/* ---------- course ---------- */
function renderCourse(id){
  const c=S.courses.get(id);
  if(!c){app.innerHTML=`<a class="back" href="#">← All classes</a>${S.loaded?`<div class="empty"><h3>Class not found</h3><p>It may have been removed.</p></div>`:statusNotice()}`;return}
  const s=summary(id),attrs=c.attrs||[];
  const mine=s.rs.find(r=>r.mine);
  const uses=[...new Set(s.rs.map(r=>(r.useful||"").trim()).filter(Boolean))];
  app.innerHTML=`
  <a class="back" href="#">← All classes</a>
  <section class="course-head">
    <div class="stamp big" style="--c:${againColor(s.m.again)}">${s.n?f1(s.m.again):"–"}<small>retake</small></div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
      <div class="code">${esc(c.dept)} ${esc(c.num)}</div><h2>${esc(c.title)}</h2>
      <div class="row">
        ${attrs.length?`<div style="display:flex;flex-direction:column;gap:2px;width:100%;font-size:13px" class="muted">${attrs.map(a=>`<span><span class="attr">${esc(attrBadge(a))}</span> ${esc(attrName(a))}</span>`).join("")}</div>`:""}
        ${canWrite()?`<button class="btn small" id="editAttrs" type="button">${attrs.length?"Edit codes":"Add A&amp;S codes"}</button>`:attrs.length?"":`<span class="muted" style="font-size:13px">No codes listed</span>`}</div>
      <div class="muted" style="font-size:14px"><span class="mono">${s.n}</span> ${s.n===1?"rating":"ratings"}</div>
    </div>
  </section>
  <section id="attrSlot"></section>
  ${statusNotice()}
  ${s.n?`<section class="measures" aria-label="Average ratings">
    ${MEASURES.map(x=>`<div class="measure"><div class="name">${x.label}<small>${x.lo} · ${x.hi}</small></div>${stars(s.m[x.k])}<span class="v">${f1(s.m[x.k])}</span></div>`).join("")}
  </section>
  ${uses.length?`<section style="display:flex;flex-direction:column;gap:8px"><span class="label">Useful for</span><div class="useful">${uses.map(u=>`<span>${esc(u)}</span>`).join("")}</div></section>`:""}`
  :`<p class="muted" style="margin:0">Nobody has rated this class yet.</p>`}
  <section id="formSlot"></section>
  <section class="reviews" aria-label="Reviews">
    ${s.rs.length?`<h3 style="font-size:20px">Reviews</h3>`:""}
    ${s.rs.map(reviewCard).join("")}
  </section>`;
  const slot=document.getElementById("formSlot");
  if(canWrite()){
    if(mine&&!S.editing)slot.innerHTML=S.flash?`<p class="ok">${esc(S.flash)}</p>`:"";
    else renderRateForm(slot,id,c,mine);
  }else if(sb&&!S.session)slot.innerHTML=signInPrompt("rate this class");
  S.flash="";
  const ea=document.getElementById("editAttrs");if(ea)ea.onclick=()=>renderAttrEditor(id,c);
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{S.editing=true;renderCourse(id);document.getElementById("formSlot").scrollIntoView({behavior:"smooth"})});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}
    b.disabled=true;const {error}=await sb.rpc("delete_my_review",{p_course_id:id});
    if(error){b.disabled=false;b.textContent="Couldn't delete. Try again";return}
    await loadAll();
  });
}

function reviewCard(r){
  const d=new Date(r.updated_at||r.created_at).toLocaleDateString(undefined,{month:"short",year:"numeric"});
  return `<article class="review ${r.mine?"mine":""}">
    <div class="who"><b>Anonymous ${esc(r.year)}</b><span>${esc(d)}</span>${r.mine?`<span style="color:var(--accent);font-weight:600">Your review</span>`:""}</div>
    <div class="minis">${MEASURES.map(x=>`<div class="mini"><span>${x.label}</span>${stars(Number(r[x.k]))}</div>`).join("")}</div>
    <p>${esc(r.body)}</p>
    ${r.useful?`<div class="uf"><b>Useful for:</b> ${esc(r.useful)}</div>`:""}
    ${r.mine&&canWrite()?`<div class="foot"><button class="btn small" data-edit type="button">Edit</button><button class="btn small danger" data-del type="button">Delete</button></div>`:""}
  </article>`;
}

/* ---------- codes ---------- */
function attrPicker(selected,prefix){
  const custom=selected.filter(a=>!ATTRS.some(x=>x[0]===a));
  return `<span class="hint">Six liberal arts codes</span>
    <div class="row">${ATTRS.slice(0,6).map(([a,n])=>`<button type="button" class="chip" id="${prefix}${a}" data-pick="${a}" aria-pressed="${selected.includes(a)}"><span class="mono">${a}</span> ${esc(n)}</button>`).join("")}</div>
    <span class="hint">Also counts toward</span>
    <div class="row">${ATTRS.slice(6).map(([a,n])=>`<button type="button" class="chip" id="${prefix}${a}" data-pick="${a}" aria-pressed="${selected.includes(a)}">${a==="WR"?`<span class="mono">WR</span> Writing`:esc(n)}</button>`).join("")}</div>
    <input type="text" id="${prefix}custom" maxlength="60" placeholder="Any other codes, comma-separated (optional)" value="${esc(custom.join(", "))}">
    <span class="hint">Use the codes DukeHub lists for the class.</span>`;
}
function readAttrs(root,prefix){
  const picked=[...root.querySelectorAll('[data-pick][aria-pressed="true"]')].map(b=>b.dataset.pick);
  const custom=root.querySelector("#"+prefix+"custom").value.split(",").map(s=>s.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,8)).filter(Boolean);
  return [...new Set([...picked,...custom])].slice(0,12);
}
function wirePicker(root){root.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")))}
function renderAttrEditor(id,c){
  const slot=document.getElementById("attrSlot");
  slot.innerHTML=`<div class="panel"><div class="field"><span class="label">Arts &amp; Sciences codes</span>${attrPicker(c.attrs||[],"ea-")}</div>
    <p class="err" id="attrErr" hidden></p>
    <div class="actions"><button class="btn primary" type="button" id="attrSave">Save codes</button><button class="btn" type="button" id="attrCancel">Cancel</button></div></div>`;
  wirePicker(slot);
  slot.querySelector("#attrCancel").onclick=()=>{slot.innerHTML=""};
  slot.querySelector("#attrSave").onclick=async()=>{
    const attrs=readAttrs(slot,"ea-"),b=slot.querySelector("#attrSave");b.disabled=true;b.textContent="Saving…";
    const {error}=await sb.from("courses").update({attrs}).eq("id",id);
    if(error){b.disabled=false;b.textContent="Save codes";const er=slot.querySelector("#attrErr");er.hidden=false;er.textContent="Couldn't save the codes. Check your connection and try again.";return}
    await loadAll();
  };
}

/* ---------- rating form ---------- */
function starPick(k,label,val){
  return `<div class="starpick" role="radiogroup" aria-label="${label}">${[5,4,3,2,1].map(n=>`<input type="radio" name="${k}" id="${k}${n}" value="${n}" ${Number(val)===n?"checked":""}><label for="${k}${n}" title="${n} of 5">★</label>`).join("")}</div>`;
}
function renderRateForm(slot,id,c,mine){
  const m=mine||{},yr=m.year||lastYear();
  slot.innerHTML=`<form id="rate" novalidate>
    <h3>${mine?"Edit your rating":"Rate "+esc(c.dept)+" "+esc(c.num)}</h3>
    <div class="field" style="max-width:260px"><label class="label" for="year">Your year</label>
      <select id="year"><option value="">Choose your year</option>${YEARS.map(y=>`<option ${y===yr?"selected":""}>${y}</option>`).join("")}</select>
      <span class="hint">Your review shows as “Anonymous ${esc(yr||"2nd year")}”. Nothing else about you is shown.</span></div>
    <div class="field"><span class="label">Ratings, out of 5 stars</span>
      <div>${MEASURES.map(x=>`<div class="pickrow"><div class="name">${x.label}<small>${x.lo} · ${x.hi}</small></div>${starPick(x.k,x.label,m[x.k])}</div>`).join("")}</div></div>
    <div class="field"><label class="label" for="text">Short review</label>
      <textarea id="text" maxlength="500" placeholder="What should someone know before signing up?">${esc(m.body)}</textarea>
      <span class="hint" id="count"></span></div>
    <div class="field"><label class="label" for="useful">Useful for</label>
      <input type="text" id="useful" maxlength="100" value="${esc(m.useful)}" placeholder="e.g. Econ major, pre-law, finance recruiting"></div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions"><button class="btn primary" type="submit" id="submitBtn">${mine?"Save changes":"Post anonymously"}</button>${mine?`<button class="btn" type="button" id="cancelEdit">Cancel</button>`:""}</div>
  </form>`;
  const ta=slot.querySelector("#text"),ct=slot.querySelector("#count");
  const cnt=()=>ct.textContent=`${ta.value.length} / 500`;cnt();ta.oninput=cnt;
  const ce=slot.querySelector("#cancelEdit");if(ce)ce.onclick=()=>{S.editing=false;renderCourse(id)};
  slot.querySelector("#rate").onsubmit=async e=>{
    e.preventDefault();const f=e.target,err=f.querySelector("#formErr");
    const year=f.querySelector("#year").value,v={},missing=[];
    if(!year)missing.push("your year");
    MEASURES.forEach(x=>{const el=f.querySelector(`[name=${x.k}]:checked`);if(el)v[x.k]=Number(el.value);else missing.push(x.label.toLowerCase())});
    const body=ta.value.trim().slice(0,500);if(!body)missing.push("a short review");
    if(missing.length){err.textContent="Add "+missing.join(", ")+" before posting.";err.hidden=false;return}
    saveYear(year);
    const btn=f.querySelector("#submitBtn");btn.disabled=true;btn.textContent="Posting…";
    const {error}=await sb.rpc("submit_review",{p_course_id:id,p_year:year,p_difficulty:v.difficulty,p_work:v.work,p_exams:v.exams,
      p_attendance:v.attendance,p_again:v.again,p_body:body,p_useful:f.querySelector("#useful").value.trim().slice(0,100)});
    if(error){btn.disabled=false;btn.textContent="Try again";err.hidden=false;
      err.textContent=/duke/i.test(error.message)?error.message:"Couldn't save your rating. Check your connection and try again.";return}
    S.editing=false;S.flash="Rating posted. Thanks for helping other students.";
    await loadAll();
  };
}

/* ---------- add class ---------- */
function renderAdd(){
  if(!canWrite()){app.innerHTML=`<a class="back" href="#">← All classes</a>${statusNotice()}${sb&&!S.session?signInPrompt("add a class"):""}`;return}
  app.innerHTML=`<a class="back" href="#">← All classes</a>
  <form id="addForm" novalidate>
    <h3>Add a class</h3>
    <p class="muted" style="margin:-8px 0 0">Use the code as it appears in the course catalog.</p>
    <div class="fields">
      <div class="field"><label class="label" for="dept">Subject code</label><input type="text" id="dept" maxlength="8" placeholder="ECON" autocomplete="off"></div>
      <div class="field"><label class="label" for="num">Number</label><input type="text" id="num" maxlength="6" placeholder="201D" autocomplete="off"></div>
    </div>
    <div class="field"><label class="label" for="title">Class title</label><input type="text" id="title" maxlength="90" placeholder="Intermediate Microeconomics I"></div>
    <div class="field"><span class="label">Arts &amp; Sciences codes</span>${attrPicker([],"ad-")}</div>
    <p class="err" id="addErr" hidden></p>
    <div class="actions"><button class="btn primary" type="submit" id="addSubmit">Add class</button></div>
  </form>`;
  const form=document.getElementById("addForm");wirePicker(form);
  form.onsubmit=async e=>{
    e.preventDefault();const err=document.getElementById("addErr");
    const dept=document.getElementById("dept").value.trim().toUpperCase().replace(/[^A-Z]/g,"");
    const num=document.getElementById("num").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    const title=document.getElementById("title").value.trim().slice(0,90);
    if(dept.length<2||!num||!title){err.textContent="Fill in the subject code (letters only), number and title.";err.hidden=false;return}
    const id=dept+"-"+num;
    if(S.courses.has(id)){location.hash="c-"+id;return}
    const b=document.getElementById("addSubmit");b.disabled=true;b.textContent="Adding…";
    const {error}=await sb.from("courses").insert({id,dept,num,title,attrs:readAttrs(form,"ad-")});
    if(error&&error.code!=="23505"){b.disabled=false;b.textContent="Add class";err.hidden=false;err.textContent="Couldn't add the class. Check your connection and try again.";return}
    await loadAll();location.hash="c-"+id;
  };
}

/* ---------- boot ---------- */
route();
if(sb){
  sb.auth.getSession().then(({data})=>{S.session=data.session;loadAll()});
  sb.auth.onAuthStateChange((evt,session)=>{
    const changed=(S.session?.user?.id)!==(session?.user?.id);S.session=session;
    if(changed){if(location.hash==="#signin"&&session)location.hash="";loadAll()}
  });
}
</script>

</body>
</html>
